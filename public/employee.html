<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CuppA — Ажилтны захиалга</title>
<link rel="icon" type="image/png" href="cuppa-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Podkova:wght@600;700;800&family=Rubik:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="store-requests.css"></head><body>
<div class="login" id="login">
  <div class="blob"></div>
  <div class="z">
    <div class="brand" style="width:120px;height:120px;margin-bottom:18px"><img src="cuppa-icon.png" alt="CUPPA"></div>
    <h1>Ажилтны<br>захиалга</h1>
    <p class="muted">Дэлгүүрийн бараа захиалга</p>
  </div>
  <form id="login-form">
    <div class="field"><label for="email">Имэйл</label><input class="input" id="email" type="email" autocomplete="username" placeholder="И-мэйл хаяг" required aria-label="Имэйл"></div>
    <div class="field"><label for="password">Нууц үг</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="Нууц үг" required aria-label="Нууц үг"></div>
    <button class="btn" style="width:100%;min-height:54px">Нэвтрэх</button>
    <p id="error" class="error" role="alert" style="min-height:16px"></p>
  </form>
</div>
<div id="workspace" hidden>
  <header class="topbar"><div class="wrap">
    <div class="brand"><img src="cuppa-icon.png" alt="CUPPA"></div>
    <div class="who"><b>CuppA</b><span>Дотоод захиалга</span></div>
    <button id="logout" class="btn btn-line spacer">Гарах</button>
  </div></header>
  <main id="requests"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="store-client.js"></script>
<script type="module">
import {mountRequests} from './store-requests.js';
const sb=window.storeClient;
async function enter(){const {data:{session}}=await sb.auth.getSession();if(!session)return;document.querySelector('#login').hidden=true;document.querySelector('#workspace').hidden=false;await mountRequests(document.querySelector('#requests'),sb);}
document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(error)throw error;document.querySelector('#password').value='';await enter();}catch(e){document.querySelector('#error').textContent=e.message;}finally{b.disabled=false;}});
document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.reload();};enter();
</script></body></html>
