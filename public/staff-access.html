<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CuppA — Ажилтны эрх</title><link rel="stylesheet" href="store-requests.css"></head><body style="background:#f7f9fc"><main class="sr"><a href="admin-panel.html">← Админ руу буцах</a><h1>Дэлгүүрийн ажилтны эрх</h1><p>Эхлээд Supabase Authentication хэсэгт ажилтны нэвтрэх бүртгэлийг үүсгэнэ. Дараа нь энд ижил имэйл болон салбарыг онооно. Энэ эрх нь барааны захиалгын хуудсанд хандах эрх; админы эрх өгөхгүй.</p><form id="form" class="sr-card" hidden><input id="email" type="email" required placeholder="Ажилтны имэйл" aria-label="Имэйл"><select id="store" aria-label="Салбар"><option>Саруул зах</option><option>Яармаг</option></select><button>Эрх хадгалах</button></form><p id="message" role="status"></p><div id="list"></div><p><a href="employee.html">Ажилтны захиалгын хуудас нээх</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="store-client.js"></script><script type="module">
const sb=window.storeClient;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const {data,error}=await sb.from('store_staff').select('*').order('email');if(error){$('#message').textContent=error.message;return;}$('#list').innerHTML=data.map(r=>`<div class="sr-card sr-row"><span>${esc(r.email)} · ${esc(r.store_name)}</span><button class="danger" data-remove="${esc(r.email)}">Эрх хасах</button></div>`).join('');}
const {data,error}=await sb.rpc('is_admin');if(error||!data){$('#message').textContent='Админ хуудсаар эхлээд нэвтэрнэ үү.';}else{$('#form').hidden=false;await load();}
$('#form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await sb.from('store_staff').upsert({email:$('#email').value.trim().toLowerCase(),store_name:$('#store').value});if(error)throw error;$('#message').textContent='Эрх хадгалагдлаа.';await load();}catch(e){$('#message').textContent=e.message;}finally{b.disabled=false;}};
$('#list').onclick=async e=>{const b=e.target.closest('[data-remove]');if(!b||!confirm('Энэ ажилтны захиалга үүсгэх эрхийг хасах уу?'))return;b.disabled=true;const {error}=await sb.from('store_staff').delete().eq('email',b.dataset.remove);$('#message').textContent=error?error.message:'Эрх хасагдлаа.';await load();};
</script></body></html>
